plugins {
    id 'com.android.application'
}

android {
    namespace 'ru.startweld.chzscan'
    compileSdk 34

    defaultConfig {
        applicationId 'ru.startweld.chzscan.v2'
        minSdk 16
        targetSdk 28
        versionCode 2
        versionName '2.0.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
