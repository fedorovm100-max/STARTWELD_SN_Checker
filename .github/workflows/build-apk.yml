name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'
      - name: Verify serial list
        run: python3 verify_serials.py
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk STARTWELD_SN_Checker.apk
      - uses: actions/upload-artifact@v4
        with:
          name: STARTWELD_SN_Checker_APK
          path: STARTWELD_SN_Checker.apk
          retention-days: 30
